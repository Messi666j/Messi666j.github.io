<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="760" height="480" rx="12" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="760" height="42" rx="12" fill="#1e293b"/>
  <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
  <text x="380" y="26" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">ROS 2 Autonomous Navigation Stack (Server-Plugin-Lifecycle Architecture)</text>

  <!-- Flowchart Stages -->
  <!-- 1. Gazebo & Sensor Input -->
  <rect x="40" y="70" width="310" height="85" rx="8" fill="url(#blueCard)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="55" y="95" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">1. SIMULATION &amp; SENSORS</text>
  <rect x="55" y="105" width="280" height="38" rx="5" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>
  <text x="195" y="129" fill="#f8fafc" font-family="sans-serif" font-size="11.5" text-anchor="middle">Gazebo World | 3D LiDAR + 6-Axis IMU</text>

  <!-- Arrow to SLAM -->
  <path d="M 350 112 L 400 112" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="405,112 397,108 397,116" fill="#38bdf8"/>

  <!-- 2. FAST-LIO2 SLAM -->
  <rect x="410" y="70" width="310" height="85" rx="8" fill="url(#cyanCard)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="425" y="95" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">2. FAST-LIO2 SLAM (ODOMETRY)</text>
  <rect x="425" y="105" width="280" height="38" rx="5" fill="#0f172a" stroke="#0891b2" stroke-width="1"/>
  <text x="565" y="129" fill="#f8fafc" font-family="sans-serif" font-size="11.5" text-anchor="middle">LiDAR-IMU Tightly-Coupled (200Hz TF2)</text>

  <!-- Down arrow to Perception & Mapping -->
  <path d="M 565 155 L 565 195" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="565,202 561,194 569,194" fill="#38bdf8"/>

  <!-- 3. Perception & ESDF Mapping -->
  <rect x="40" y="205" width="680" height="110" rx="8" fill="url(#emeraldCard)" stroke="#10b981" stroke-width="1.5"/>
  <text x="55" y="230" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">3. PERCEPTION &amp; FIELD MAPPING SERVER (Pluginlib Managed)</text>

  <rect x="65" y="245" width="200" height="55" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="165" y="268" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Point Cloud Corrector</text>
  <text x="165" y="288" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Deskewing &amp; Frame Align</text>

  <rect x="280" y="245" width="200" height="55" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="380" y="268" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PCA Ground Segmentor</text>
  <text x="380" y="288" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Obstacle Extraction</text>

  <rect x="495" y="245" width="210" height="55" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="600" y="268" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3D ESDF Field Map</text>
  <text x="600" y="288" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Euclidean Signed Distance</text>

  <!-- Down arrow to Planning & MPPI -->
  <path d="M 380 315 L 380 348" stroke="#10b981" stroke-width="2"/>
  <polygon points="380,355 376,347 384,347" fill="#10b981"/>

  <!-- 4. Planning & Local Control -->
  <rect x="40" y="355" width="680" height="105" rx="8" fill="url(#amberCard)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="55" y="380" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">4. PLANNING &amp; MPPI LOCAL CONTROLLER</text>

  <rect x="65" y="395" width="295" height="50" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="212" y="416" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Global Planner &amp; B-Spline Optimizer</text>
  <text x="212" y="434" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="middle">Continuous curvature trajectory</text>

  <rect x="385" y="395" width="320" height="50" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="545" y="416" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MPPI (Model Predictive Path Integral)</text>
  <text x="545" y="434" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">GPU/Multi-thread parallel sampling (50Hz /cmd_vel)</text>
</svg>
